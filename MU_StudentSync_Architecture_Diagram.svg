<svg width="680" height="460" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>MU StudentSync architecture</title>
<desc>Activity observes ViewModel, which coordinates a Repository, which reads and writes Room locally and, later, a remote API via Retrofit.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="190" y="40" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="60" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#042C53">Activity (screen)</text>
<text x="340" y="80" text-anchor="middle" font-family="Arial" font-size="12" fill="#0C447C">Observes LiveData</text>

<line x1="340" y1="96" x2="340" y2="130" stroke="#444441" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="190" y="130" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="150" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#26215C">ViewModel</text>
<text x="340" y="170" text-anchor="middle" font-family="Arial" font-size="12" fill="#3C3489">Survives rotation</text>

<line x1="340" y1="186" x2="340" y2="220" stroke="#444441" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="190" y="220" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="240" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#04342C">Repository</text>
<text x="340" y="260" text-anchor="middle" font-family="Arial" font-size="12" fill="#085041">Coordinates data sources</text>

<path d="M340 276 L340 300 L250 300 L250 320" fill="none" stroke="#444441" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M340 276 L340 300 L500 300 L500 320" fill="none" stroke="#444441" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="140" y="320" width="220" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="250" y="340" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#173404">Room (local)</text>
<text x="250" y="360" text-anchor="middle" font-family="Arial" font-size="12" fill="#27500A">Durable local storage</text>

<rect x="390" y="320" width="220" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="500" y="340" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#412402">Retrofit (remote)</text>
<text x="500" y="360" text-anchor="middle" font-family="Arial" font-size="12" fill="#633806">API, Activity C/D</text>

<text x="340" y="415" text-anchor="middle" font-family="Arial" font-size="12" fill="#5F5E5A">Room runs on a background executor; results return to the main thread via LiveData or a callback.</text>
<text x="340" y="433" text-anchor="middle" font-family="Arial" font-size="12" fill="#5F5E5A">A FakeStudentRepository implements the same Repository interface for unit testing, with no Room or network involved.</text>
</svg>
